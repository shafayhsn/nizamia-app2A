name: Web egress acceptance
on:
  push:
    branches: [web-login/admin-only-settings-payments]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: https://nzos-test.invalid
      VITE_SUPABASE_ANON_KEY: test-public-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run build && node --test server/*.test.cjs
      - run: python -m pip install playwright==1.55.0
      - name: Test order photos, stage saves and dashboard totals in Chromium
        run: |
          npx vite preview --host 127.0.0.1 --port 5099 >/tmp/vite.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:5099 >/dev/null && break; sleep 1; done
          python tests/web_egress.py
