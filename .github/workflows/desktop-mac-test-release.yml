name: Publish desktop Mac test release

on:
  workflow_dispatch:
    inputs:
      validation_only:
        description: 'Validate Build 510 without publishing a DMG'
        required: false
        type: boolean
        default: true
      version:
        description: 'Desktop version to publish (must match desktop/package.json)'
        required: false
        type: string
      confirmation:
        description: 'Type PUBLISH-UNSIGNED-TEST to confirm this is an unsigned test release'
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate-build-510:
    if: inputs.validation_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout App-2A development branch
        uses: actions/checkout@v4
        with:
          ref: feature/CP-18-sqlite-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate snapshot API syntax and table coverage
        run: |
          node --check api/desktop/snapshot.js
          node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('api/desktop/snapshot.js','utf8');
          for (const table of ['orders','buyers','suppliers','production_daily_entries','costing_sheets','shipping_bookings']) {
            if (!source.includes('"'+table+'"')) throw Error('Missing business table: '+table);
          }
          console.log('Build 510 snapshot API validation passed');
          NODE
  publish:
    if: github.ref == 'refs/heads/feature/CP-18-sqlite-foundation' && inputs.validation_only != true && inputs.confirmation == 'PUBLISH-UNSIGNED-TEST'
    runs-on: macos-15-intel
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout desktop branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release version and ensure no tag collision
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node -e "const p=require('./desktop/package.json');if(process.env.RELEASE_VERSION!==p.version||!/^[0-9]+\\.[0-9]+\\.[0-9]+$/.test(p.version))process.exit(1)"
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Version tag already exists; refusing to overwrite"
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Build bundled desktop web application
        env:
          APP2A_DESKTOP_BUILD: '1'
        run: npm run build
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Verify updater and standalone offline safety
        working-directory: desktop
        run: |
          node --check main.cjs
          node desktopUpdates.test.cjs
          node standaloneRecords.test.cjs
          node snapshotReplaceGuard.test.cjs
          node snapshotStartup.test.cjs
          node release-guardrails.test.cjs
      - name: Build unsigned Intel DMG
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac
      - name: Rename and checksum release installer
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          file="$(find desktop/release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$file"
          test "$(stat -f%z "$file")" -gt 1000000
          cp "$file" "desktop/release/Nizamia-App-2A-$RELEASE_VERSION.dmg"
          shasum -a 256 "desktop/release/Nizamia-App-2A-$RELEASE_VERSION.dmg" > "desktop/release/Nizamia-App-2A-$RELEASE_VERSION.dmg.sha256"
      - name: Publish explicitly marked unsigned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$RELEASE_VERSION" \
            "desktop/release/Nizamia-App-2A-$RELEASE_VERSION.dmg" \
            "desktop/release/Nizamia-App-2A-$RELEASE_VERSION.dmg.sha256" \
            --target "$GITHUB_SHA" \
            --title "Nizamia App-2A v$RELEASE_VERSION (Unsigned Mac Test)" \
            --notes "Unsigned internal macOS Intel test build. No automatic installation. Keep existing SQLite data folder; back up before replacing the application." \
            --prerelease
