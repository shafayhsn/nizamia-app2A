name: Publish desktop Mac test release

on:
  push:
    branches:
      - feature/CP-18-sqlite-foundation
    paths:
      - 'desktop/release-v0.1.9.request'
      - 'api/desktop/**'
      - '.github/workflows/desktop-mac-test-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Desktop version to publish (must match desktop/package.json)'
        required: true
        type: string
      confirmation:
        description: 'Type PUBLISH-UNSIGNED-TEST to confirm this is an unsigned test release'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-desktop-snapshot:
    if: github.event_name == 'push' && github.event.head_commit.message != 'release request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Build 510 desktop snapshot endpoint
        run: |
          node --check api/desktop/snapshot.js
          node -e "const fs=require('fs');const s=fs.readFileSync('api/desktop/snapshot.js','utf8');for(const name of ['orders','buyers','suppliers','production_daily_entries','costing_sheets','shipping_bookings'])if(!s.includes('\\\"'+name+'\\\"'))throw Error('Missing snapshot table '+name);console.log('Desktop snapshot endpoint syntax and business table coverage verified')"
  publish:
    if: github.ref == 'refs/heads/feature/CP-18-sqlite-foundation' && ((github.event_name == 'push' && (contains(github.event.head_commit.added, 'desktop/release-v0.1.9.request') || contains(github.event.head_commit.modified, 'desktop/release-v0.1.9.request'))) || inputs.confirmation == 'PUBLISH-UNSIGNED-TEST')
    runs-on: macos-15-intel
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout desktop branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release version and ensure no tag collision
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && '0.1.9' || inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node -e "const p=require('./desktop/package.json');if(process.env.RELEASE_VERSION!==p.version||!/^[0-9]+\\.[0-9]+\\.[0-9]+$/.test(p.version))process.exit(1)"
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Version tag already exists; refusing to overwrite"
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Build bundled desktop web application
        env:
          APP2A_DESKTOP_BUILD: '1'
        run: npm run build
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Verify updater and standalone offline safety
        working-directory: desktop
        run: |
          node --check main.cjs
          node desktopUpdates.test.cjs
          node standaloneRecords.test.cjs
          node offlineSyncPlannerSafety.test.cjs
          node offlineCoverageReadiness.test.cjs
          node offlineOmsSmoke.test.cjs
          node offlineSyncClient.test.cjs
          node offlineSyncReconciliation.test.cjs
          node offlineSyncCoordinator.test.cjs
          node desktopLocalBackup.test.cjs
          node desktopDmgPreflight.test.cjs
          node snapshotReplaceGuard.test.cjs
          node snapshotMerge.test.cjs
          node snapshotDownloadClient.test.cjs
          node cloudRefreshPlanner.test.cjs
          node applyCloudSnapshot.test.cjs
          node --check snapshotImport.cjs
          node snapshotStartup.test.cjs
          node release-guardrails.test.cjs
          node --test offlineMutationPlan.test.cjs offlineMutationOutbox.test.cjs ../server/desktopProductionCreate.test.cjs
      - name: Build unsigned Intel DMG
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac
      - name: Mount and verify packaged Intel Mac application
        working-directory: desktop
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && '0.1.9' || inputs.version }}
        run: |
          set -euo pipefail
          dmg="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          DMG_PATH="$PWD/$dmg" node -e "const {inspectVerifiedDmg}=require('./desktopDmgPreflight.cjs');inspectVerifiedDmg({dmgPath:process.env.DMG_PATH,version:process.env.RELEASE_VERSION}).then(x=>console.log('Verified packaged DMG:',x)).catch(e=>{console.error(e);process.exitCode=1})"
      - name: Rename and checksum release installer
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && '0.1.9' || inputs.version }}
        run: |
          set -euo pipefail
          file="$(find desktop/release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$file"
          test "$(stat -f%z "$file")" -gt 1000000
          cp "$file" "desktop/release/Nizamia-App-2A-$RELEASE_VERSION.dmg"
          shasum -a 256 "desktop/release/Nizamia-App-2A-$RELEASE_VERSION.dmg" > "desktop/release/Nizamia-App-2A-$RELEASE_VERSION.dmg.sha256"
      - name: Publish explicitly marked unsigned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event_name == 'push' && '0.1.9' || inputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$RELEASE_VERSION" \
            "desktop/release/Nizamia-App-2A-$RELEASE_VERSION.dmg" \
            "desktop/release/Nizamia-App-2A-$RELEASE_VERSION.dmg.sha256" \
            --target "$GITHUB_SHA" \
            --title "Nizamia App-2A v$RELEASE_VERSION (Unsigned Mac Test)" \
            --notes "Unsigned internal macOS Intel test build. Includes offline upload for new Production Register entries created by an administrator. Existing local entries and other module changes remain on the Mac. The in-app updater backs up the local database." \
            --prerelease
