name: Publish verified NZOS 1.0
on:
  push:
    branches: [feature/nzos-1.0]
    paths: [.github/workflows/nzos-stable.yml]
permissions:
  contents: read
concurrency: nzos-stable-1-0
jobs:
  publish:
    if: github.event.head_commit.message == 'Publish verified NZOS 1.0 Intel checkpoint'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TESTED_SHA: 31b65d56395f279fd9fb25dfe7e184332f123e76
      VERIFIED_RUN: 44490066394
    steps:
      - name: Validate tested revision and release inputs
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq '.parents[0].sha')" = "$TESTED_SHA"
          run="$(gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN")"
          jq -e --arg sha "$TESTED_SHA" '.conclusion=="success" and .head_sha==$sha and .head_branch=="feature/nzos-1.0" and .path==".github/workflows/desktop-mac-intel.yml"' <<< "$run"
          gh run download "$VERIFIED_RUN" -n app2a-mac-intel-unsigned -D installers
          (cd installers/release && sha256sum -c NZOS-1.0.0-Intel.dmg.sha256)
          (cd installers/compat && sha256sum -c Nizamia-NZOS-1.0.0-Intel.dmg.sha256)
      - name: Publish the two verified installers at the tested source revision
        run: |
          set -euo pipefail
          gh release create v1.0.0 --repo "$GH_REPO" --target "$TESTED_SHA" --title 'NZOS 1.0 for Intel Mac' --draft \
            --notes 'For a fresh installation, download NZOS-1.0.0-Intel.dmg and drag NZOS into Applications. The Nizamia-NZOS installer supports the existing in-app updater. Back up first. Close the old app before starting NZOS. This release is unsigned.' \
            installers/release/*.dmg installers/release/*.sha256 installers/compat/*.dmg installers/compat/*.sha256
          gh release edit v1.0.0 --repo "$GH_REPO" --draft=false --latest
          gh release view v1.0.0 --repo "$GH_REPO" --json tagName,isDraft,assets --jq 'select(.tagName=="v1.0.0" and .isDraft==false and (.assets|length)==4) | .tagName' | grep -Fx v1.0.0
