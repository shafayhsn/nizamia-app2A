name: Intel Mac desktop prototype

on:
  push:
    branches:
      - standalone/desktop-foundation-cp15
      - feature/CP-18-sqlite-foundation
    paths:
      - 'desktop/**'
      - 'server/**'
      - 'src/offlineDesktop.jsx'
      - 'src/offlineDesktop.css'
      - 'offline-desktop.html'
      - 'vite.config.js'
      - '.github/workflows/desktop-mac-intel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout desktop branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install web application dependencies
        run: npm install --no-audit --no-fund
      - name: Validate production web application build
        run: npm run build
      - name: Build packaged React assets with relative URLs
        env:
          APP2A_DESKTOP_BUILD: '1'
        run: npm run build
      - name: Verify desktop React bundle
        run: |
          test -s dist/index.html
          test -s dist/offline-desktop.html
          test -d dist/assets
          grep -q 'assets/' dist/index.html
          grep -q 'assets/' dist/offline-desktop.html
          test -n "$(find dist/assets -type f -name '*.js' -print -quit)"
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Check desktop entry syntax
        working-directory: desktop
        run: |
          node --check main.cjs
          node --check localDatabase.cjs
          node --check snapshotImport.cjs
          node --check snapshotReplaceGuard.cjs
          node --check snapshotInspect.cjs
          node --check snapshotViewer.cjs
          node --check offlineWorkspace.cjs
          node --check offlineDraftPreview.cjs
          node --check offlineDraftRecovery.cjs
          node --check offlineReportLayout.cjs
          node --check offlineReportPresets.cjs
          node --check offlinePersonalNotes.cjs
          node --check offlineEditCoordinator.cjs
          node --check offlineSignedDraftGrant.cjs
          node --check snapshotStartup.cjs
          node --check offlineCsvExport.cjs
          node --check offlineDraftJournal.cjs
          node --check offlineSyncPlanner.cjs
          node --check offlineSessionManager.cjs
          node --check snapshotViewerPreload.cjs
          node --check snapshotViewerRenderer.js
      - name: Run offline SQLite smoke tests
        working-directory: desktop
        run: node offline-smoke.test.cjs
      - name: Test protection against overwriting pending offline drafts
        working-directory: desktop
        run: node snapshotReplaceGuard.test.cjs
      - name: Test offline CSV export and spreadsheet injection safeguards
        working-directory: desktop
        run: node offlineCsvExport.test.cjs
      - name: Test offline-first SQLite startup validation
        working-directory: desktop
        run: node snapshotStartup.test.cjs
      - name: Test authenticated local draft previews
        working-directory: desktop
        run: node offlineDraftPreview.test.cjs
      - name: Test offline draft recovery exports
        working-directory: desktop
        run: node offlineDraftRecovery.test.cjs
      - name: Test offline report sorting and column selection
        working-directory: desktop
        run: node offlineReportLayout.test.cjs
      - name: Test persistent offline report presets
        working-directory: desktop
        run: node offlineReportPresets.test.cjs
      - name: Test operational purchasing shipping and approval exceptions
        working-directory: desktop
        run: node offlineOperationalExceptions.test.cjs
      - name: Test authenticated offline API route wiring
        working-directory: desktop
        run: node ../server/offlineRoutes.test.cjs
      - name: Test offline business forms and local operational reports
        working-directory: desktop
        run: node standaloneForms.test.cjs
      - name: Test standalone offline business records
        working-directory: desktop
        run: node standaloneRecords.test.cjs
      - name: Test refreshed-snapshot conflict rebase
        working-directory: desktop
        run: node offlineConflictRebase.test.cjs
      - name: Test offline sync history and conflict resolution
        working-directory: desktop
        run: node offlineSyncHistory.test.cjs
      - name: Test durable offline sync queue integration
        working-directory: desktop
        run: node offlineSyncCoordinator.test.cjs
      - name: Test offline draft queue reconciliation
        working-directory: desktop
        run: node offlineSyncReconciliation.test.cjs
      - name: Test end-to-end desktop-to-cloud sync contract
        working-directory: desktop
        run: node ../server/offlineSyncEndToEnd.test.cjs
      - name: Test PostgreSQL sync transactions and rollback
        working-directory: desktop
        run: node ../server/offlinePostgresSyncTransaction.test.cjs
      - name: Test sync HTTP request boundary
        working-directory: desktop
        run: node ../server/offlineSyncHttpHandler.test.cjs
      - name: Test authenticated desktop HTTPS sync transport
        working-directory: desktop
        run: node offlineSyncClient.test.cjs
      - name: Test authenticated conditional cloud sync apply
        working-directory: desktop
        run: node ../server/offlineSyncApply.test.cjs
      - name: Test trusted server-signed offline draft grants
        working-directory: desktop
        run: node offlineTrustedGrantBroker.test.cjs
      - name: Test offline editing and synchronization readiness
        working-directory: desktop
        run: node offlineReadiness.test.cjs
      - name: Test independent production stage balances
        working-directory: desktop
        run: node offlineProductionBalance.test.cjs
      - name: Test downloadable calculated OMS report data
        working-directory: desktop
        run: node offlineSystemReportExport.test.cjs
      - name: Test cross-module order progress and purchasing/shipping reports
        working-directory: desktop
        run: node offlineCrossModuleReports.test.cjs
      - name: Test data-driven operational system reports
        working-directory: desktop
        run: node offlineSystemReports.test.cjs
      - name: Guard full OMS page coverage
        working-directory: desktop
        run: node offlinePageCoverage.test.cjs
      - name: Test persistent Mac-local personal notes
        working-directory: desktop
        run: node offlinePersonalNotes.test.cjs
      - name: Test trusted offline edit staging integration
        working-directory: desktop
        run: node offlineEditCoordinator.test.cjs
      - name: Test cryptographic offline edit grants
        working-directory: desktop
        run: node offlineSignedDraftGrant.test.cjs
      - name: Verify server-issued offline grants against desktop verifiers
        working-directory: desktop
        run: node ../server/offlineGrantIssuer.test.cjs
      - name: Test authenticated offline authorization API adapter
        working-directory: desktop
        run: node ../server/offlineAuthorizationHandler.test.cjs
      - name: Test desktop-to-server signed authorization transport
        working-directory: desktop
        run: node offlineAuthorizationClient.test.cjs
      - name: Test cross-module offline search
        working-directory: desktop
        run: node offlineGlobalSearch.test.cjs
      - name: Run desktop security and release guardrails
        working-directory: desktop
        run: node release-guardrails.test.cjs
      - name: Validate offline draft safety and conflicts
        working-directory: desktop
        run: node offlineDraft.test.cjs
      - name: Test isolated authenticated offline draft journal
        working-directory: desktop
        run: node offlineDraftJournal.test.cjs
      - name: Test offline synchronization conflict planner
        working-directory: desktop
        run: node offlineSyncPlanner.test.cjs
      - name: Test expiring offline authentication verifier
        working-directory: desktop
        run: node offlineAuthVerifier.test.cjs
      - name: Test offline login lockout policy
        working-directory: desktop
        run: node offlineLoginPolicy.test.cjs
      - name: Test offline draft authorization policy
        working-directory: desktop
        run: node offlineDraftAuthorization.test.cjs
      - name: Test OS-encrypted credential store foundation
        working-directory: desktop
        run: node offlineCredentialStore.test.cjs
      - name: Test integrated offline authentication coordinator
        working-directory: desktop
        run: node offlineAuthService.test.cjs
      - name: Test main-process offline session lifecycle
        working-directory: desktop
        run: node offlineSessionManager.test.cjs
      - name: Test signed offline enrollment proof verification
        working-directory: desktop
        run: node offlineEnrollmentProof.test.cjs
      - name: Build Intel macOS DMG
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac
      - name: Upload unsigned Intel Mac DMG
        uses: actions/upload-artifact@v7
        with:
          name: app2a-mac-intel-unsigned
          path: desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 14
