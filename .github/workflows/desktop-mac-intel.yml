name: Intel Mac desktop prototype

on:
  push:
    branches:
      - standalone/desktop-foundation-cp15
      - feature/CP-18-sqlite-foundation
      - feature/desktop-two-way-sync
      - feature/box-2-validation
      - feature/box-4-validation
    paths:
      - 'api/**'
      - 'desktop/**'
      - 'server/**'
      - 'src/main.jsx'
      - 'src/App.jsx'
      - 'src/lib/**'
      - 'src/pages/**'
      - 'src/components/**'
      - 'src/offlineDesktop.jsx'
      - 'src/offlineDesktop.css'
      - 'offline-desktop.html'
      - 'vite.config.js'
      - '.github/workflows/desktop-mac-intel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout desktop branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install web application dependencies
        run: npm install --no-audit --no-fund
      - name: Check offline adapter source integrity
        run: |
          node --input-type=module --check < src/lib/supabase.js
          node src/lib/offlineAdapterContract.test.cjs
          node --check desktop/snapshotReplaceGuard.cjs
          node --check desktop/standaloneRecords.cjs
      - name: Verify packaged desktop sync and refresh modules
        run: |
          node --test desktop/desktopSyncLoop.test.cjs desktop/desktopCloudSession.test.cjs
          node -e "const p=require('./desktop/package.json');for(const f of ['desktopSyncLoop.cjs','snapshotDownloadClient.cjs','applyCloudSnapshot.cjs','snapshotMerge.cjs'])if(!p.build.files.includes(f))throw Error('Missing packaged module '+f)"
      - name: Verify desktop order sync endpoint
        run: |
          node --check api/offline-sync.js
          node --test server/desktopOrderSync.test.cjs server/snapshotTableReader.test.cjs
      - name: Validate production web application build
        run: npm run build
      - name: Build packaged React assets with relative URLs
        env:
          APP2A_DESKTOP_BUILD: '1'
        run: npm run build
      - name: Verify desktop React bundle
        run: |
          test -s dist/index.html
          test -s dist/offline-desktop.html
          test -d dist/assets
          test -n "$(find dist/assets -type f -name '*.zip' -print -quit)"
          grep -q 'assets/' dist/index.html
          grep -q 'assets/' dist/offline-desktop.html
          test -n "$(find dist/assets -type f -name '*.js' -print -quit)"
      - name: Verify standalone SQLite modules are packaged
        run: |
          node -e "const p=require('./desktop/package.json');for(const f of ['standaloneRecords.cjs','standaloneForms.cjs','offlineOms.cjs']){if(!p.build.files.includes(f))throw Error('Missing packaged module '+f)}"
          node --check desktop/standaloneRecords.cjs
          node --check desktop/standaloneForms.cjs
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Test linked desktop sync workflows
        run: node --test server/desktopOrderDetails.test.cjs server/desktopOrderRemoval.test.cjs server/desktopOrderSectionCopy.test.cjs server/desktopPoMatrix.test.cjs server/desktopBuyer.test.cjs server/desktopSupplier.test.cjs server/desktopParcelTransition.test.cjs server/desktopArea3.test.cjs server/desktopPurchasingCreate.test.cjs src/lib/offlineProjection.test.cjs
      - name: Check desktop entry syntax
        working-directory: desktop
        run: |
          node --check main.cjs
          node --check offlineOms.cjs
          node --check offlinePendingStatus.cjs
          node --check localDatabase.cjs
          node --check snapshotImport.cjs
          node --check snapshotReplaceGuard.cjs
          node --check snapshotInspect.cjs
          node --check snapshotViewer.cjs
          node --check offlineWorkspace.cjs
          node --check offlineDraftPreview.cjs
          node --check offlineDraftRecovery.cjs
          node --check offlineReportLayout.cjs
          node --check offlineReportPresets.cjs
          node --check offlinePersonalNotes.cjs
          node --check offlineEditCoordinator.cjs
          node --check offlineSignedDraftGrant.cjs
          node --check snapshotStartup.cjs
          node --check offlineCsvExport.cjs
          node --check offlineDraftJournal.cjs
          node --check offlineSyncPlanner.cjs
          node --check offlineSessionManager.cjs
          node --check snapshotViewerPreload.cjs
          node --check snapshotViewerRenderer.js
      - name: Test guarded offline schema alignment
        working-directory: desktop
        run: |
          node --check offlineSchemaAlignment.cjs
          node offlineSchemaAlignment.test.cjs
          node --check offlineSchemaMigration.cjs
          node offlineSchemaMigration.test.cjs
          node offlineSchemaMigration.integration.test.cjs
          node offlinePendingStatus.test.cjs
          node offlineDraftPanel.test.cjs
      - name: Run offline SQLite smoke tests
        working-directory: desktop
        run: node offline-smoke.test.cjs
      - name: Test protection against overwriting pending offline drafts
        working-directory: desktop
        run: node snapshotReplaceGuard.test.cjs
      - name: Test offline CSV export and spreadsheet injection safeguards
        working-directory: desktop
        run: node offlineCsvExport.test.cjs
      - name: Test offline-first SQLite startup validation
        working-directory: desktop
        run: node snapshotStartup.test.cjs
      - name: Test authenticated local draft previews
        working-directory: desktop
        run: node offlineDraftPreview.test.cjs
      - name: Test offline draft recovery exports
        working-directory: desktop
        run: node offlineDraftRecovery.test.cjs
      - name: Test offline report sorting and column selection
        working-directory: desktop
        run: node offlineReportLayout.test.cjs
      - name: Test persistent offline report presets
        working-directory: desktop
        run: node offlineReportPresets.test.cjs
      - name: Test operational purchasing shipping and approval exceptions
        working-directory: desktop
        run: node offlineOperationalExceptions.test.cjs
      - name: Test authenticated offline API route wiring
        working-directory: desktop
        run: node ../server/offlineRoutes.test.cjs
      - name: Test offline costing calculations and FOB margin
        working-directory: desktop
        run: node offlineCosting.test.cjs
      - name: Test offline business forms and local operational reports
        working-directory: desktop
        run: node standaloneForms.test.cjs
      - name: Verify all 40 bundled QMS Excel workbooks
        working-directory: desktop
        run: node qmsWorkbookIntegrity.test.cjs
      - name: Verify original business screen offline contract
        working-directory: desktop
        run: node originalScreenContract.test.cjs
      - name: Test standalone offline business records
        working-directory: desktop
        run: node standaloneRecords.test.cjs
      - name: Test refreshed-snapshot conflict rebase
        working-directory: desktop
        run: node offlineConflictRebase.test.cjs
      - name: Test offline sync history and conflict resolution
        working-directory: desktop
        run: node offlineSyncHistory.test.cjs
      - name: Test durable offline sync queue integration
        working-directory: desktop
        run: node offlineSyncCoordinator.test.cjs
      - name: Test offline draft queue reconciliation
        working-directory: desktop
        run: node offlineSyncReconciliation.test.cjs
      - name: Test end-to-end desktop-to-cloud sync contract
        working-directory: desktop
        run: |
          node ../server/offlineSyncEndToEnd.test.cjs
          node --test desktopOrderNoteQueue.test.cjs desktopOrderNoteRoundTrip.test.cjs
      - name: Test PostgreSQL sync transactions and rollback
        working-directory: desktop
        run: node ../server/offlinePostgresSyncTransaction.test.cjs
      - name: Test sync HTTP request boundary
        working-directory: desktop
        run: node ../server/offlineSyncHttpHandler.test.cjs
      - name: Verify offline sync server security
        working-directory: desktop
        run: node ../server/offlineSyncSecurity.test.cjs
      - name: Test authenticated sync HTTP service integration
        working-directory: desktop
        run: node ../server/offlineSyncService.test.cjs
      - name: Test existing OMS signed session verification for sync
        working-directory: desktop
        run: node ../server/offlineOmsSyncSecurity.test.cjs
      - name: Test gated OMS PostgreSQL synchronization composition
        working-directory: desktop
        run: node ../server/offlineOmsPostgresSyncService.test.cjs
      - name: Test authenticated desktop HTTPS sync transport
        working-directory: desktop
        run: node offlineSyncClient.test.cjs
      - name: Test authenticated conditional cloud sync apply
        working-directory: desktop
        run: node ../server/offlineSyncApply.test.cjs
      - name: Test trusted server-signed offline draft grants
        working-directory: desktop
        run: node offlineTrustedGrantBroker.test.cjs
      - name: Test offline editing and synchronization readiness
        working-directory: desktop
        run: node offlineReadiness.test.cjs
      - name: Test independent production stage balances
        working-directory: desktop
        run: node offlineProductionBalance.test.cjs
      - name: Test downloadable calculated OMS report data
        working-directory: desktop
        run: node offlineSystemReportExport.test.cjs
      - name: Test cross-module order progress and purchasing/shipping reports
        working-directory: desktop
        run: node offlineCrossModuleReports.test.cjs
      - name: Test data-driven operational system reports
        working-directory: desktop
        run: node offlineSystemReports.test.cjs
      - name: Guard full OMS page coverage
        working-directory: desktop
        run: node offlinePageCoverage.test.cjs
      - name: Test persistent Mac-local personal notes
        working-directory: desktop
        run: node offlinePersonalNotes.test.cjs
      - name: Test trusted offline edit staging integration
        working-directory: desktop
        run: node offlineEditCoordinator.test.cjs
      - name: Test cryptographic offline edit grants
        working-directory: desktop
        run: node offlineSignedDraftGrant.test.cjs
      - name: Verify server-issued offline grants against desktop verifiers
        working-directory: desktop
        run: node ../server/offlineGrantIssuer.test.cjs
      - name: Test authenticated offline authorization API adapter
        working-directory: desktop
        run: node ../server/offlineAuthorizationHandler.test.cjs
      - name: Test desktop-to-server signed authorization transport
        working-directory: desktop
        run: node offlineAuthorizationClient.test.cjs
      - name: Test cross-module offline search
        working-directory: desktop
        run: node offlineGlobalSearch.test.cjs
      - name: Run desktop security and release guardrails
        working-directory: desktop
        run: node release-guardrails.test.cjs
      - name: Validate offline draft safety and conflicts
        working-directory: desktop
        run: node offlineDraft.test.cjs
      - name: Test isolated authenticated offline draft journal
        working-directory: desktop
        run: node offlineDraftJournal.test.cjs
      - name: Test offline synchronization conflict planner
        working-directory: desktop
        run: node offlineSyncPlanner.test.cjs
      - name: Test expiring offline authentication verifier
        working-directory: desktop
        run: node offlineAuthVerifier.test.cjs
      - name: Test offline login lockout policy
        working-directory: desktop
        run: node offlineLoginPolicy.test.cjs
      - name: Test offline draft authorization policy
        working-directory: desktop
        run: node offlineDraftAuthorization.test.cjs
      - name: Test OS-encrypted credential store foundation
        working-directory: desktop
        run: node offlineCredentialStore.test.cjs
      - name: Test integrated offline authentication coordinator
        working-directory: desktop
        run: node offlineAuthService.test.cjs
      - name: Test main-process offline session lifecycle
        working-directory: desktop
        run: node offlineSessionManager.test.cjs
      - name: Test signed offline enrollment proof verification
        working-directory: desktop
        run: node offlineEnrollmentProof.test.cjs
      - name: Verify original offline desktop release inputs
        working-directory: desktop
        run: node releaseInputs.test.cjs
      - name: Test desktop release checker
        working-directory: desktop
        run: node desktopUpdates.test.cjs
      - name: Test pre-update database backup
        working-directory: desktop
        run: node desktopUpdateBackup.test.cjs
      - name: Test Mac installer target safety
        working-directory: desktop
        run: node desktopInstallGuard.test.cjs
      - name: Test DMG preflight validation
        working-directory: desktop
        run: node desktopDmgPreflight.test.cjs
      - name: Test atomic replacement and rollback
        working-directory: desktop
        run: node desktopReplaceRollback.test.cjs
      - name: Test external Mac update helper
        working-directory: desktop
        run: node desktopMacUpdateHelper.test.cjs
      - name: Test updater launch bridge
        working-directory: desktop
        run: node desktopUpdateLaunch.test.cjs
      - name: Check updater source syntax
        working-directory: desktop
        run: |
          node --check desktopUpdateLaunch.cjs
          node --check main.cjs
          bash -n desktopMacUpdateHelper.sh
      - name: Test local SQLite backup, snapshot merge and offline reopen
        working-directory: desktop
        run: node --test desktopLocalBackup.test.cjs snapshotMerge.test.cjs localDesktopAuth.test.cjs
      - name: Verify Areas 2 to 4 inside Intel Electron
        if: github.ref == 'refs/heads/feature/box-4-validation'
        timeout-minutes: 7
        run: |
          set -euo pipefail
          resources="desktop/node_modules/electron/dist/Electron.app/Contents/Resources"
          dest="$resources/web"
          test ! -e "$dest"
          cp -R dist "$dest"
          trap 'rm -rf "$dest"' EXIT
          desktop/node_modules/.bin/electron desktop/box2-intel-acceptance.cjs

      - name: Build Intel macOS DMG
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac
      - name: Inspect the packaged Intel DMG
        run: |
          set -euo pipefail
          dmg="$(find desktop/release -maxdepth 1 -name '*.dmg' -size +1M -print -quit)"
          test -n "$dmg"
          hdiutil verify "$dmg"
          mount_path="$(mktemp -d)"
          trap 'hdiutil detach "$mount_path" -quiet || true; rmdir "$mount_path" || true' EXIT
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mount_path" "$dmg"
          bundle="$mount_path/Nizamia App-2A.app/Contents"
          test "$(lipo -archs "$bundle/MacOS/Nizamia App-2A")" = x86_64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Info.plist")" = com.nizamia.app2a.desktop
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$bundle/Info.plist")" = "$(node -p "require('./desktop/package.json').version")"
          test -s "$bundle/Resources/web/index.html"
          test -s "$bundle/Resources/app.asar"
          node - "$bundle/Resources/app.asar" <<'NODE'
          const asar = require('./desktop/node_modules/@electron/asar')
          const archive = process.argv[2]
          const expected = ['main.cjs', 'snapshotDownloadClient.cjs', 'applyCloudSnapshot.cjs', 'snapshotMerge.cjs', 'offlineDraftJournal.cjs', 'offlineSyncCoordinator.cjs', 'desktopCloudSession.cjs', 'desktopLocalBackup.cjs', 'desktopMacUpdateHelper.sh']
          for (const file of expected) {
            if (!asar.statFile(archive, file)) throw Error('Missing packaged file ' + file)
          }
          NODE

          (cd desktop/release && shasum -a 256 "$(basename "$dmg")" > "$(basename "$dmg").sha256")
      - name: Upload unsigned Intel Mac DMG
        uses: actions/upload-artifact@v7
        with:
          name: app2a-mac-intel-unsigned
          path: |
            desktop/release/*.dmg
            desktop/release/*.dmg.sha256
          if-no-files-found: error
          retention-days: 14
